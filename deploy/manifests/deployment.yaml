apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-troubleshooter
  labels:
    app: k3s-troubleshooter
    component: agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k3s-troubleshooter
  template:
    metadata:
      labels:
        app: k3s-troubleshooter
    spec:
      serviceAccountName: k3s-troubleshooter-sa
      containers:
        - name: agent-worker
          image: ghcr.io/latentworx-asimov/k3s-troubleshooter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: inbox
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: api-key
                  optional: true
            - name: TEMPORAL_HOST_PORT
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
