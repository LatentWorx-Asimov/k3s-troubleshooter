apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-troubleshooter-sa
  labels:
    app: k3s-troubleshooter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-troubleshooter-role
rules:
  - apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io"]
    resources: ["pods", "pods/log", "services", "endpoints", "deployments", "replicasets", "statefulsets", "daemonsets", "events", "ingress", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-troubleshooter-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-troubleshooter-role
subjects:
  - kind: ServiceAccount
    name: k3s-troubleshooter-sa
    namespace: default
